<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F5F0">
<title>KK · 跨境电商增长顾问</title>
<style>
:root{
  --bg:#F7F5F0; --card:#FFFFFF; --line:#E6E1D7; --ink:#181B1F; --sub:#6A717A;
  --accent:#85631E; --accent-bg:#F3ECDC; --user:#181B1F; --ok:#1F7A4D;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  display:flex; justify-content:center;
}
/* 🔴 必须是定高（不是 min-height）：选项多的时候（产品设计七个模块）底部操作区会撑高，
   用 min-height 时 .wrap 跟着长，整条 bar 被推出视口 —— 客户只看到前两个模块，其余永远点不到。
   定高后 #chat 自己内部滚，bar 永远贴着视口底部。100dvh 处理 iOS 地址栏伸缩，前面留 100vh 兜底。 */
.wrap{width:100%; max-width:520px; min-height:100vh; height:100vh; height:100dvh; display:flex; flex-direction:column}
header{
  position:sticky; top:0; z-index:5; background:rgba(247,245,240,.94);
  backdrop-filter:saturate(160%) blur(10px); border-bottom:1px solid var(--line);
  padding:12px 18px calc(12px + env(safe-area-inset-top)*0);
}
.hd{display:flex; align-items:center; gap:10px}
.logo{
  width:34px;height:34px;border-radius:10px;background:var(--ink);color:#C6A356;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;letter-spacing:.5px;flex:none
}
.hd .n{font-weight:700;font-size:16px;letter-spacing:.3px}
.hd .n small{font-weight:400;color:var(--sub);font-size:12px;margin-left:6px;letter-spacing:0}
.hd .r{font-size:12px;color:var(--sub);margin-top:1px}

#chat{flex:1; overflow-y:auto; padding:18px 16px 8px; display:flex; flex-direction:column; gap:10px}
.row{display:flex}
.row.me{justify-content:flex-end}
.bub{
  max-width:82%; padding:10px 14px; border-radius:16px; font-size:15px; white-space:pre-wrap; word-break:break-word;
  background:var(--card); border:1px solid var(--line); border-bottom-left-radius:6px;
  box-shadow:0 1px 2px rgba(24,27,31,.04);
}
.row.me .bub{background:var(--user); color:#fff; border-color:var(--user); border-bottom-left-radius:16px; border-bottom-right-radius:6px}
.bub b{color:var(--accent); font-weight:600}
/* 退款口径小字（2026-10-21 定：体验价不退）。⭐ 刻意做小做灰：
   它是「付款前必须知道」，不是拿来劝付的卖点 ⇒ ⛔ 加粗/放大＝把风险写到脸上，白劝退一批人。 */
.rfd{font-size:12.5px;color:var(--sub);line-height:1.7}
.row.me .bub b{color:#D8BE82}
.typing{display:inline-flex;gap:4px;align-items:center;height:20px}
.typing i{width:6px;height:6px;border-radius:50%;background:#C3BCAF;animation:t 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes t{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

.card{
  background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px;
  font-size:14px; color:var(--sub); box-shadow:0 1px 2px rgba(24,27,31,.04);
}
.card .t{font-weight:600;color:var(--ink);font-size:15px;margin-bottom:8px}
.card .kv{display:flex;gap:8px;padding:3px 0}
.card .kv .k{color:var(--sub);flex:none;width:74px}
.card .kv .v{color:var(--ink);word-break:break-all}

#bar{
  border-top:1px solid var(--line); background:rgba(247,245,240,.96);
  backdrop-filter:blur(10px); padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  display:flex; flex-direction:column; gap:8px;
}
.opts{display:flex; flex-direction:column; gap:8px}
.opt{
  width:100%; text-align:left; border:1px solid var(--line); background:var(--card); color:var(--ink);
  border-radius:12px; padding:11px 14px; font-size:15px; cursor:pointer; font-family:inherit;
  transition:border-color .15s,background .15s;
}
.opt:active{background:var(--accent-bg);border-color:var(--accent)}
.opt em{font-style:normal;color:var(--accent);font-weight:600;margin-right:8px}
/* 两列模式：长文本（"联系方式　13800000000" / 链接）会被折成两行、格子高低不齐
   ⇒ 一律单行 + 省略号。值不需要看全（客户认的是字段名 + 头几位）。 */
.opts.grid .opt{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.inrow{display:flex; gap:8px}
.inrow input{
  flex:1; border:1px solid var(--line); background:var(--card); border-radius:12px; padding:11px 14px;
  font-size:16px; color:var(--ink); font-family:inherit; outline:none; min-width:0;
}
.inrow input:focus{border-color:var(--accent)}
.inrow button{
  border:none; background:var(--ink); color:#fff; border-radius:12px; padding:0 18px; font-size:15px;
  cursor:pointer; font-family:inherit; flex:none;
}
.inrow button:disabled{opacity:.35}
.hint{font-size:12px;color:var(--sub);text-align:center;padding:2px 0 0}

.btn{
  display:block; text-align:center; text-decoration:none; background:var(--accent); color:#fff;
  border-radius:12px; padding:13px 16px; font-size:16px; font-weight:600;
}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.foot{font-size:12px;color:var(--sub);text-align:center;padding:10px 16px 6px;line-height:1.7}
.foot a{color:var(--sub)}
/* 收款卡：码 + 金额 + 怎么付，三样同屏。
   ⛔ 金额是客户手输的（固定收款码不带金额），不在码旁边写死数字＝必有人付错。 */
.pay{text-align:center}
.pay img{
  /* 212 = 手机屏上"一眼看出这是要扫的东西"的下限；再小客户会以为是装饰图而不是收款码 */
  width:212px;height:212px;max-width:84%;margin:2px auto 6px;display:block;
  border:1px solid var(--line);border-radius:12px;background:#fff;object-fit:contain;
  /* 🔴🔴🔴 这张码在**页面上**付不了款，只当"备用路径的素材"（2026-10-21 kk 两次真机实测改判）：
     ① 长按它 —— 微信 webview 的长按菜单里**没有「识别图中二维码」**（那一项只给聊天/公众号里的图）；
     ② 点 wxp:// 链接 —— 我上一版把它做成「点这里付款」按钮，kk 实测**点了不跳转、不弹付款页**。
     ⛔⛔ **个人收款码在 H5 里没有任何付款入口**（没有商户号 ⇒ 没有 JSAPI、没有支付回调）。
        ⇒ 页面不负责"付"，只负责"把人送到微信里付"：主路径是下面的**复制微信号**按钮，
          加上好友后在聊天里**直接转账**（不用扫任何码）。码降级为"不想加好友"时的存相册素材。
     ⛔ img 外面依然不许包 <a>：包了长按弹的是**链接**菜单，连"保存图片"都会没。
        想要"看大图"只能做图**下方**的独立文字链接，不碰 img。 */
  -webkit-touch-callout:default; -webkit-user-select:auto; user-select:auto; -webkit-user-drag:auto
}
/* ⭐⭐ 复制微信号按钮（2026-10-21 二次改判后的**真正主路径**）：
   个人收款码在 H5 里没有付款入口 ⇒ 唯一确定能收钱的路是"加上微信好友 → 聊天里转账"。
   这个按钮把那一步压成"点一下 + 微信里粘贴"，客户不用手抄十来位混合大小写的号。 */
.pay .pbtn{display:block;margin:10px auto 0}
/* 复制成功后切成"回执"外观（浅底 + 深色字）：客户一眼看出这一步过了，
   ⛔ 别还留着金底 —— 看着像还能再点，他会反复按（见 .cta .btn.done 同一条规矩）。 */
.pay .pbtn.done{background:var(--accent-bg);color:var(--ink);border:1px solid var(--line)}
.pay .alt{display:block;margin-top:9px;font-size:12.5px;color:var(--sub);text-decoration:underline}
/* ⭐ 兜底指引：默认**收起**，只有点了「不想加好友」才展开 ——
   ⛔ 一开始就铺两条路＝客户不知道先走哪条（2026-10-21 已踩，两条并列原地卡住）。 */
.pay .fbk{display:none;margin-top:8px;padding:9px 11px;background:var(--accent-bg);
  border-radius:10px;font-size:12.5px;color:var(--ink);line-height:1.8;text-align:left}
.pay .fbk.on{display:block}
/* 兜底里的括注（"没有这一项就…"）压成灰小字：一行主指令 + 一行补丁，客户扫一眼就能照着做 */
.pay .fbk .dim{color:var(--sub);font-size:12px}
.pay .how .dim{color:var(--sub);font-size:12px}
/* 续聊卡（跳出去扫一扫回来时用） */
.resume{text-align:center}
.resume .rh{font-size:14px;color:var(--ink);line-height:1.6}
.resume .rs{font-size:12.5px;color:var(--sub);line-height:1.7;margin:6px 0 10px}
.resume .btn{width:100%;font-family:inherit;cursor:pointer;border:none}
.pay .zoom{display:inline-block;font-size:12.5px;color:var(--sub);margin:-2px auto 8px;text-decoration:underline}
.pay .amt{font-size:19px;font-weight:700;color:var(--ink);letter-spacing:.3px}
.pay .amt b{color:var(--accent);font-size:22px}
.pay .how{font-size:12.5px;color:var(--sub);line-height:1.8;margin-top:6px;text-align:left}
.pay .how .p1{color:var(--ink)}
.pay .nopic{font-size:13px;color:var(--ink);line-height:1.8}
/* 付完确认按钮（2026-10-21）：客户付完**留在页面里**点一下，不用来回切微信。
   ⛔ 别做成输入框 —— S4 之后 bar 已经清了，这里只给「一个动作」，不给第二选择。 */
.cta{text-align:center}
.cta .btn{width:100%;font-family:inherit;cursor:pointer;border:none}
.cta .tip{font-size:12.5px;color:var(--sub);line-height:1.7;margin-top:8px;text-align:left}
/* ⭐ 点过之后按钮变成「已受理」态：浅底 + 深字，⛔ 别只做 opacity:.55 ——
   金底白字降到 55% 之后对比度不到 3:1，客户会以为按钮坏了/没点上。
   ⛔ 也别继续用强调色：这块已经不是"要他点"，而是"回执"。 */
.cta .btn.done{background:var(--accent-bg);color:var(--ink);border:1px solid var(--line);opacity:1;cursor:default}
.done{display:flex;flex-direction:column;gap:10px}
.toast{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(24,27,31,.92);color:#fff;
  padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9
}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hd">
      <div class="logo">KK</div>
      <div>
        <div class="n">KK<small>洪宝森</small></div>
        <div class="r">跨境电商增长顾问</div>
      </div>
    </div>
  </header>

  <div id="chat"></div>

  <div id="bar"></div>
  <div class="foot">
    信息仅用于本次对接，不会提供给第三方<span id="footTel"></span>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   Kiki-Bot · 海报二维码入口
   ⛔ 修改前必读（2026-10-20 定）：
   1. LINKS 四个链接必须分开（对应 A/B/C/D 四个需求分支）。
      合成一个通用落地页 = 让用户白答一遍分支问题，且线索不带需求标签。
   2. 当前接收端 = 个人微信（SINK=pushplus）。token 为空时答案只在本地生成
      "可复制摘要" + 跳申请链接；填上 token 才会自动推送。
      ⛔ 不要在前端硬编码任何 app_secret（token 是推送地址，泄露只影响骚扰，可接受）。
   3. 渠道不用 ?utm_source=（会把短链撑长），用短链路径区分，见 README。
   ========================================================================= */
/* 🔴 留空 = S4 只出「复制我的信息」，不出外跳按钮。
   ⛔ 绝不允许填占位串：一个点开是 404 的"申请按钮"比没有按钮更伤信任。 */
/* ⭐⭐ E 分支的两个 Agent（2026-10-20 定）：**两个系统按不同单位计量，⛔ 不能混成一个"额度"。**
   产品设计按 token、跨境电商按次数 —— 说错单位等于承诺错东西，客户跑完后一定会来问。
   🔴 额度与站点的唯一真源在这里；价格另在 PRICE.E（两个同价 19.9 / 个体验码）。 */
/* ⭐ 两套 Agent 的「站点 / 额度 / 模块清单」只写在这一个常量里（2026-10-21 补模块）。
   🔴 模块清单是第二问的选项源，⛔ 不许在 EXT.E 里再抄一份——两边一旦不一致，
      客户看到的功能跟站点里实际的会对不上。跨境电商那边四个模块同样收在这里，保持对称。 */
const AGENT = {
  "AI 产品设计": {site:"https://www.kumia.design",          quota:"10,000 token",
    mods:["竞品采集","矢量线稿","融合设计","改花改款","2D/3D 模特效果图","工业CAD制版","工艺BOM表"]},
  "AI 跨境电商": {site:"https://kuajing-ai.up.railway.app", quota:"10 次",
    mods:["品牌溯源","Listing 优化","广告打法","A+ 海报设计","爆款与改款","变体加色","类目研究"]}
};
const LINKS = {
  A: "",   // 链接诊断申请表
  /* ⭐ B 按课题分（2026-10-20 定）：客户选的课题就是路由，四个课题各给一集试听。
     留空 = 不渲染「看试听」按钮，走微信发文件（⛔ 空链接比没按钮更伤信任）。
     规格见 B试听_交付规格/B1_课题试听清单.md */
  B: {运营:"", 经营:"", 战略:"", 品牌:""},
  C: "",   // 线下共创营（诚意金 500）
  D: "",   // 咨询预约（诚意金 1000，留电话等回联）
  /* ⭐ E 跟 B 同构：客户选哪个系统，按钮就指到哪个系统（⛔ 直接 LINKS[b] 会拿到对象 ⇒ [object Object] 死链） */
  E: {"AI 产品设计": AGENT["AI 产品设计"].site,
      "AI 跨境电商": AGENT["AI 跨境电商"].site}
};

/* ⭐⭐ 价格口径（2026-10-20 定）：**⛔ 不赠免费体验，一律收体验价 / 诚意金**。
   判据：免费来的线索不珍惜也不筛人，收一小笔钱反而把"真想解决"的人留下。
   🔴 报价只在 S4 报（先说清给什么，再说多少钱）—— ⛔ 开场就报价会把人吓跑。
   🔴 价格只认这里，⛔ 不许在话术里另写一个数字（两处不一致＝客户截图来问，最伤信任）。 */
const PRICE = {
  A: {list:199,  trial:19.9, what:"单款诊断 + Alexa 诊断优化，两份报告"},
  /* B 按课题分：体验价买的是「那一集完整正片」，原价是整门课 */
  B: {"运营":{list:999,  trial:99},
      "经营":{list:1999, trial:199},
      "战略":{list:3999, trial:399},
      "品牌":{list:2999, trial:299}},
  /* 诚意金：可抵 / 可退两个出口都要写，⛔ 只说"诚意金"不给退路＝听着像押金 */
  C: {deposit:500,  what:"线下共创营席位", back:"开营前退出可退，到场可抵课程费"},
  D: {deposit:1000, what:"咨询预约排期",   back:"不合适提前说可退，成交可抵咨询费"},
  /* ⭐ E 卖的是「体验码」不是「名额」（2026-10-20 定）：19.9 一个码，1 个月内有效，带额度上限。
     🔴 原价未定 ⇒ list 留空，气泡只写体验价。⛔ 不许拿 A 的 199 或 B 的课价来凑删除线
        （那是别的东西的原价，写成原价＝自己造一个假锚点） */
  /* ⭐ E 的额度⛔ 不写在这里：两个系统单位不同（token / 次），写死一个就必然说错另一个。
     额度从 AGENT[所选系统].quota 取（唯一真源在 AGENT）。 */
  E: {list:"", trial:19.9, unit:"体验码", valid:"1 个月内有效"}
};
/* ---------- 收款入口（2026-10-21 定：页面内给微信收款码图，付完截图回传） ----------
   🔴 只放「收款码」（微信 → 我 → 服务 → 收款与经营 里的那个二维码，别人扫了是付钱给你）。
      ⛔ 绝不放「付款码」（收付款页那个条码 + 数字）——那是给别人扫走你钱的，公开即资损。
   🔴 PAY 是对象 ⇒ if(PAY) 永远为真，空配置也会渲染出一个空框。
      渲染与否一律走 payBlock()：金额为空、或（图与微信号都没有）⇒ 整块不渲染。
   🔴 图挂了/还没图 ⇒ 自动落到文字版（加微信要码），⛔ 绝不出现破图。 */
const PAY = {
  img: "pay_qr.png",  // 收款码图（2026-10-21 上线）：相对路径，与 index.html 同目录。留空 ⇒ 走文字版
  /* 🔴🔴🔴 **H5 里付不了款，页面只负责把人送进微信**（2026-10-21 kk 两次真机实测，全部改判）：
     ① 长按码 → 菜单里没有「识别图中二维码」（webview 里的 <img> 不给这一项）；
     ② 点 wxp:// 链接 → **点了不跳转、不弹付款页**（我上一版把它做成「点这里付款」主按钮，实测失败）。
     ⛔⛔ **个人收款码（无商户号）在 H5 上不存在任何付款入口**：没有 JSAPI、没有支付回调、scheme 也不放行。
        ⇒ 别再往页面里塞第四条"点一下就能付"的路。**能收钱的地方只有微信聊天里。**
     ✅ 主路径 = 下面的**复制微信号**按钮：加上好友后，他在聊天里**直接转账**给我（不用扫任何码），
        或我发收款码给他，在聊天里长按付。⛔ 别在文案里指定"聊天里长按一定会有识别项"——
        那是同一类没验证过的手势，我只说"转账"和"我发给你"这两种确定成立的动作。 */
  /* ⭐ 这里只做一件事：说清"加我之后怎么付"。
     ⛔ 别在这儿也写一遍"存到相册"的三步 —— 那是兜底块（.fbk）的活，
        两处都写＝同一段话出现两次，客户读到第二遍就跳过第一段了（2026-10-21 截图里撞到）。 */
  /* ⭐ 验证消息这句是"跳出后等你通过"那段空白期的救命稻草：客户加了好友就干等着，

/* 🔴🔴 这里曾经有一个 `_leftPage` 标记（visibilitychange 判"页面有没有被盖住"），

/* ⭐⭐ 进度存档 v2（2026-10-21 三次反馈后重做）：主路径＝复制微信号→**跳去微信添加好友**，
   跳出必然丢页面 —— 回来接不接得住，全看这份存档。v1 有三个洞，这次全堵：

   🔴 洞2（覆盖面）：v1 只在 S4 存档 ⇒ 答题中途跳出＝六题白答。v2 存 {b,a,i,st}，
      回来能从**第 i 题**接着答，不是只救走到付款的人。
   🔴 洞3（单点存储）：部分微信 webview（隐私模式等）localStorage.setItem 直接抛错，
      v1 的 try/catch 把它静默吞了 ⇒ 存档悄悄丢失。v2 双写 cookie 兜底（读时先
      localStorage 后 cookie）。⛔ 别删 cookie 这条：它是"存了但读不回来"的唯一保险。
   🔴 依旧只存**业务数据**，⛔ 不存 innerHTML：DOM 里的 onclick 是 JS 属性，序列化后再
      塞回去会变成一堆点了没反应的死按钮（事件全丢）⇒ 恢复必须重新走渲染，不能回放 HTML。 */
function saveProg(){
  const d = {b:S.branch, a:S.ans, i:S.i, st:S.stage, p:S.paid||0, t:Date.now()};
  const s = JSON.stringify(d);
  try{ localStorage.setItem(PROG, s); }catch(e){}
  try{ document.cookie = PROG + "=" + encodeURIComponent(s)
       + ";max-age=" + 3*24*3600 + ";path=/;SameSite=Lax"; }catch(e){}
}
function loadProg(){
  let r = null;
  try{ r = JSON.parse(localStorage.getItem(PROG) || "null"); }catch(e){}
  if(!r || !r.b){          /* localStorage 被清/被禁/抛错 ⇒ 读 cookie 这份 */
    try{
      const m = document.cookie.match(new RegExp("(?:^|;\\s*)" + PROG + "=([^;]*)"));
      if(m) r = JSON.parse(decodeURIComponent(m[1]));
    }catch(e){}
  }
  if(!r || !r.b) return null;
  if(Date.now() - (r.t || 0) > 72*3600*1000) return null;   /* 三天前的半成品不再打扰 */
  return r;
}

function scroll(){ requestAnimationFrame(()=>chat.scrollTop = chat.scrollHeight); }
function say(html, me){
  const row = document.createElement("div");

  b.className = "bub"; b.innerHTML = html;
  row.appendChild(b); chat.appendChild(row); scroll();
}
function card(html){
  const row = document.createElement("div"); row.className = "row";
  const c = document.createElement("div"); c.className = "card"; c.innerHTML = html;
  row.appendChild(c); chat.appendChild(row); scroll();
  return c;   /* 返回节点：收款卡要拿它绑图片的 onerror（⛔ 内联 onerror 在模板字符串里容易转义错） */
}
function typing(ms){
  const row = document.createElement("div"); row.className = "row";
  const b = document.createElement("div"); b.className = "bub";
  b.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  row.appendChild(b); chat.appendChild(row); scroll();
  return new Promise(r=>setTimeout(()=>{row.remove(); r();}, ms));
}
function clearBar(){ bar.innerHTML = ""; }
function options(list, onPick, hint, wide){
  const w = document.createElement("div"); w.className = "opts";
  /* ⭐ 选项多（>5，产品设计七个模块）才切两列 + 限高自滚；四选一那种竖排更好点，
     ⛔ 别无条件写成两列——四选一改成两列反而像标签云。
     限高是第二道保险：小屏（375×667）上七项单列会占掉半屏，把上面的对话全顶没。 */
  if(list.length > 5){
    w.classList.add("grid");
    w.style.display = "grid"; w.style.gridTemplateColumns = "1fr 1fr"; w.style.gap = "8px";
    w.style.maxHeight = "38vh"; w.style.overflowY = "auto";
  }
  list.forEach(txt=>{
    const b = document.createElement("button"); b.className = "opt";
    /* wide(txt) ⇒ 占满整行。给"都不对，我重新填一遍"这类长兜底项用：
       两列里它会折成两行，且右边空一格看着像漏了一项。 */
    if(wide && wide(txt)) b.style.gridColumn = "span 2";
    const m = txt.match(/^([A-E])\s+(.*)$/);
    b.innerHTML = m ? `<em>${m[1]}</em>${m[2]}` : txt;
    b.onclick = ()=>{ say(txt.replace(/^[A-D]\s+/, ""), true); onPick(txt); };
    w.appendChild(b);
  });
  bar.appendChild(w);
  if(hint){ const h = document.createElement("div"); h.className = "hint"; h.textContent = hint; bar.appendChild(h); }
}
function askText(ph, onSend){
  const r = document.createElement("div"); r.className = "inrow";
  const i = document.createElement("input"); i.placeholder = ph || "输入…"; i.autocomplete = "off";
  const b = document.createElement("button"); b.textContent = "发送"; b.disabled = true;
  i.oninput = ()=>{ b.disabled = !i.value.trim(); };
  const go = ()=>{ const v = i.value.trim(); if(!v) return; say(v, true); clearBar(); onSend(v); };
  b.onclick = go;
  i.onkeydown = e=>{ if(e.key === "Enter") go(); };
  r.appendChild(i); r.appendChild(b); bar.appendChild(r);
  setTimeout(()=>i.focus(), 60);
}
function toast(msg){
  const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("on");
  setTimeout(()=>t.classList.remove("on"), 1500);
}

/* ⭐⭐ 续聊卡（2026-10-21）：付款要"存相册 → 扫一扫"，**必须离开这个页面**，
   而微信随时会把这个 webview 回收掉 ⇒ 客户扫完回来，六题全没了、从头再答一遍＝绝大多数人就此流失。
   ⇒ 一回来就给他这张卡：点一下直接重放到付款那一步，答案原样带过去。
   🔴 重放走 `deliver(true)`，⛔ 不回放 HTML：DOM 里的 onclick 是 JS 属性，
      存 innerHTML 再塞回去会得到一堆点了没反应的死按钮（事件全丢）。 */
function resumeCard(r){
  /* ⭐⭐ v2 分阶段恢复（2026-10-21 三次反馈）：跳出时他走到哪一步，回来就从哪一步接。
     v1 只认一种档（S4 付款档）⇒ 答题中途/确认页跳出的人回来什么都没有。
     st 判定：s2=答题中（按 i 接着问）、s3=确认页、s4=付款；旧档（无 st）必是 v1 的 S4 档。 */
  const a = r.a || {};
  const who = BRANCH_NAME[r.b] || "";
  const qLen = GEN.concat(EXT[r.b] || []).length;
  /* 答题中：i < 总题数（⛔ 拿不准就当 s4 处理 —— 把没答完的人直接甩去付款，报价必错） */
  const mid = r.st === "s2" && typeof r.i === "number" && r.i < qLen;
  /* ⭐ 答完最后一道题、还没在复述卡上点确认就跳出 ⇒ 档是 {st:"s2", i:qLen}。
     🔴 这条⛔ 不能按"回到付款那一步"放：那会跳过确认，且 deliver(true) 不推送
        ⇒ 这条线索你永远收不到（客户还在没确认的情况下被报了价）。⇒ 一律归为回去确认。 */
  const cf  = r.st === "s3" || (r.st === "s2" && typeof r.i === "number" && r.i >= qLen);
  const amt = (mid || cf) ? "" : amount(r.b, a);   /* 答题中/确认页金额未定，⛔ 不显示 */
  /* 🔴 `r.i || qLen` 是错的：i=0（刚选完分支就跳出）时 0 是 falsy ⇒ 会显示成"答到第 6/6 题"。
     反向验证抓到过一次 ⇒ 必须判 typeof，⛔ 别用 || 给下标兜底。 */
  const done = typeof r.i === "number" ? Math.min(r.i, qLen) : qLen;
  const c = card(`<div class="resume">`
    + `<div class="rh">欢迎回来 · <b>${who}</b>${a.topic ? " · " + a.topic : ""}`
    + `${amt ? " · ¥" + amt : ""}</div>`
    /* ⭐ 已点过「我付好了」的，⛔ 别再让他点一次（重复推送会刷屏，还会被误判成两笔订单） */
    + (r.p ? `<div class="rs">你已经点过「我付好了」，我这边正在核收款 —— 不用再点。</div>` : "")
    + `<div class="rs">${mid
        /* 🔴 i=0（刚选完分支就跳出）别显示"答到第 0/6 题"——那是句废话，还得让他疑心 */
        ? (done === 0 ? `你刚选好方向，题还没开始答 —— 点下面接着答。`
                      : `上次答到第 <b>${done}/${qLen}</b> 题，接着答就行，答过的不重问。`)
        : cf ? `题都答完了，就差最后一步确认。`
        : (r.p ? `点下面直接回到付款那一步。`
             : `前面那几题不用重答，点下面直接回到付款那一步。`)}</div>`
    + `<button class="btn" id="rs">${mid ? "接着答 →" : cf ? "回去确认 →" : "回到付款那一步 →"}</button></div>`);
  c.querySelector("#rs").onclick = ()=>{
    S.branch = r.b;
    S.ans = a;
    S.paid = r.p || 0;
    S.queue = GEN.concat(EXT[r.b] || []);
    chat.innerHTML = ""; clearBar();
    if(mid){
      S.stage = "s2"; S.i = r.i;
      say("欢迎回来 👋 接着上次的继续：");
      setTimeout(nextQ, 300);
    }else if(cf){
      S.stage = "s3"; S.i = S.queue.length;
      confirm_();
    }else{
      S.stage = "s4"; S.i = S.queue.length;
      deliver(true);
    }
  };
}

/* ---------- 流程 ---------- */
async function s0(){
  /* 页脚电话：MY_TEL 为空就保持纯文本「转人工」——
     ⛔ 不要留 href="tel:" 的空号，点下去毫无反应（2026-10-20 用户实测踩到） */
  /* ⛔ 没电话就把整个「· 转人工」去掉，别留一个点了没反应的纯文本（看着像能点，其实是死路） */
  const ft = document.getElementById("footTel");
  if(ft) MY_TEL ? ft.innerHTML = ` · <a href="tel:${MY_TEL}">转人工</a>` : ft.remove();
  /* ⭐ 有未完成进度就先把续聊卡挂出来：回来的人第一眼要看到"不用重来"。
     ⛔ 不替他自动跳 —— 他可能只是点错进来的，自动重放会把开场白整个吞掉。 */
  const pr = loadProg();
  if(pr) resumeCard(pr);
  await typing(500);
  /* ⛔ 开场不报价（S4 才报）：先让人知道能得到什么，再说多少钱。
     一上来就报 19.9 / 500 会把还在观望的人吓跑，线索直接少一半。 */
  say("你好，我是 <b>Kiki-Bot</b>，KK 团队的 AI 顾问 👋<br>我可以帮你对接五件事：链接诊断、课程试听、线下共创营、咨询预约、自研 AI Agent 体验码。<br>大概 30 秒问清情况，我按你的情况给你对应的安排（诊断报告 / 试听一集 / 席位 / 电话回联 / 体验码），并说清这一步的费用。过程中不会向第三方泄露你的信息。<br><br>先问一下：你现在最想解决的是哪一类？");
  /* 🔴 有未完成存档时**不许**自动开跑（2026-10-21）：
     客户是 refresh 回来的，URL 上那个 ?b=A 还在 ⇒ 会自动从第一题重答一遍，
     把顶上那张"回到付款那一步"的续聊卡直接冲走，等于存档白存。
     ⇒ 有存档就停在"开场白 + 续聊卡"，他自己点继续、或者从下面的选项重新选一个分支（＝真重来）。 */
  if(PRE && BRANCH_NAME[PRE] && !pr){    /* 深链直达分支，省掉一次选择 */
    setTimeout(()=>{ say(`你要的是 <b>${BRANCH_NAME[PRE]}</b> 对吧？直接开始 👇`, true); pickBranch(PRE); }, 320);
    return;
  }
  S.stage = "s1";
  options(["A 链接诊断","B 课程试听","C 线下共创营","D 咨询预约","E AI Agent 体验"], pickBranch,
          "也可以直接在下面用一句话说你的情况");
  askText("说一句你的情况", v=>{
    const hit = RULES.find(r=>r[0].test(v));
    if(hit){ pickBranch(hit[1]); }
    else { say("你说的我大概归到 <b>链接诊断</b>，如果不对你可以直接说「不对」，我再换一个。", false); pickBranch("A"); }
  });
}

/* S1 需求识别：命中即进分支；"不对"回退一次 */
function pickBranch(code){
  const c = (code || "").trim().charAt(0).toUpperCase();
  if(!BRANCH_NAME[c]) return;
  S.branch = c; S.stage = "s2";
  S.queue = GEN.concat(EXT[c]);
  S.i = 0;
  saveProg();            /* ⭐ 选定分支就落盘：从这一刻起任何跳出都接得住 */
  clearBar();
  setTimeout(nextQ, 380);
}

/* S2 收集 */
async function nextQ(){
  if(S.i >= S.queue.length){ return confirm_(); }
  await typing(420);
  /* ⭐ 每答完一题就落盘（i 已递增）：中途跳出的人回来从**下一题**接着答，六题不再白答 */
  await askOne(S.queue[S.i], ()=>{ S.i++; saveProg(); setTimeout(nextQ, 300); });
}

/* ⭐ 渲染一题 + 收答案。走完全程（nextQ）和「改单项目」（fixOne）共用这一份，
   ⛔ 别为了改单项目再抄一段渲染：两份逻辑迟早不同步（opt 写成函数时尤其明显，
      例：E 的第二问选项依赖 a.sys，抄漏 ev() ⇒ 换系统后模块清单还是旧的）。 */
async function askOne(q, onAns){
  /* ⭐ 问题允许写成函数（E 的第二问要按所选 Agent 换题型）⇒ 三个字段都要先求值再渲染。
     ⛔ 只求值 t 不管 type / opt：产品设计那一路会照旧渲染成跨境电商的四个选项。 */
  const ev = (v, d) => typeof v === "function" ? v(S.ans) : (v === undefined ? d : v);
  const t = ev(q.t), ty = ev(q.type, "opt");
  if(t) say(t);
  S.stage = "s2";
  if(ty === "opt"){
    options(ev(q.opt, []), v=>{ S.ans[q.k] = v; clearBar(); onAns(); }, ev(q.hint, ""));
  }else{
    askText(q.ph || "输入…", v=>{ S.ans[q.k] = v; onAns(); });
  }
}

/* ⭐⭐ 复述卡的行渲染抽成独立函数：confirm_（第一次确认）和 deliver(replay)（跳出去
   又回来重放）共用。回来的客户第一眼要看到「我答过的都还在」，⛔ 只甩一张付款卡给他
   —— 那看着像凭空冒出来的，他会怀疑刚才聊的丢了（2026-10-21 用户实测正是这个观感）。 */
function recapRows(a, b){
  const detail = [];
  if(a.scale) detail.push(a.scale);
  if(a.role)  detail.push(a.role);
  /* 共创营的席位数：排期和报价都要用它，不上卡片后面就没处问了 */
  if(a.seat)  detail.push("带 " + a.seat);
  /* ⭐ B 选的课题必须上复述卡：这是这一条线索的路由依据，
     卡片上不显示，客户只能凭印象点"对"，我们这边也就少了排序信息。 */
  if(a.topic) detail.push("课题「" + a.topic + "」");
  /* ⭐ E 选的是哪一套系统必须上复述卡：额度、站点、发哪个码全挂在它上面 */
  if(a.sys)   detail.push(a.sys);
  if(a.scene) detail.push(a.scene);
  if(a.want)  detail.push(a.want);
  if(a.block) detail.push("卡在「" + a.block + "」");
  if(a.url)   detail.push(a.url);
  if(a.now)   detail.push("现用 " + a.now);
  /* 🔴 分支专属字段必须进复述卡。原版只带 A 的 block，B/C/D 答的"想解决/体量/场景"全不显示
     ⇒ 用户看到一张缺了自己答案的卡片，只能凭印象点"对"，确认这一步就白做了。 */
  const rows = [
    ["称呼", a.name], ["平台 / 品类", (a.plat||"") + " / " + (a.cat||"")],
    ["需求", BRANCH_NAME[b] || ""],
    ["情况", detail.join(" · ")],
    ["联系方式", a.ct],
    /* ⭐ 客户手打的话要上复述卡：他确认时一眼看到"这句也被记下了"，才放心点是 */
    ["补充说明", a.note]
  ].filter(r=>r[1]);
  return rows.map(r=>`<div class="kv"><div class="k">${r[0]}</div><div class="v">${esc(r[1])}</div></div>`).join("");
}

/* S3 复述确认 */
async function confirm_(){
  S.stage = "s3";
  saveProg();            /* ⭐ 到确认这一步也落盘：确认页跳出的人回来直接回确认，不用重答 */
  const a = S.ans;
  await typing(500);
  say("我记一下，你看对不对：");
  card(recapRows(a, S.branch));
  await typing(300);
  /* ⭐ 交付物已按分支分化：A=两份报告 / D=电话回联 / B,C=入口。
     ⛔ 统一说"申请链接"会让 A、D 客户等一个根本不会来的链接。 */
  /* 🔴 这里只有 S.branch，没有局部变量 b（b 只在 deliver() 里定义）。
     上一版误用 b ⇒ ReferenceError ⇒ 后面的 options()/askText() 全不执行 ⇒
     复述卡出来却没有确认按钮，客户卡死在 s3。改回 S.branch。 */
  /* 🔴🔴 措辞必须跟界面一致：**这一步给的是两个按钮，不是输入框**。
     原版写「回复『对』」「哪里不对直接说」——手机上根本没有地方可输，
     客户照着做只会在底部找输入框，找不到就以为页面坏了（跟「回复『人工』」同一个病：
     **凡是"让他输入"的指令，先确认那一刻 bar 里到底有没有输入框**）。
     ⇒ 一律改成点按钮的说法，并点名按钮上的字。 */
  /* 🔴 BAD 里点名"用不着重填"：客户最怕点个"不对"就被打回原点。 */
  const BAD = "；哪里不对点「不对，我要改」，我只重问那一处，其余不用重填。";
  say(S.branch === "A" ? "点「对，没问题」我就按这个链接给你出两份报告" + BAD
    : S.branch === "D" ? "点「对，没问题」我就按这个登记，同学会在 1 个工作日内电话联系你" + BAD
    : S.branch === "B" ? "点「对，没问题」我就把这个课题的试听那一集发你" + BAD
    : S.branch === "C" ? "点「对，没问题」我就把席位给你留上，并说清诚意金怎么交" + BAD
    : S.branch === "E" ? `点「对，没问题」我就把 <b>${S.ans.sys || "Agent"}</b> 的体验码发你，并说清有效期和额度` + BAD
    : "点「对，没问题」我就把申请入口发你" + BAD);
  options(["对，没问题","不对，我要改"], async v=>{
    clearBar();
    if(v.startsWith("对")) return deliver();
    await typing(320);
    say("好，点一下要改的那一项 👌");
    setTimeout(editMenu, 300);
  });
  askText("要改哪里？直接写", async v=>{
    /* 🔴 用户习惯直接打字「对」而不是点按钮——这个兜底框原来把所有输入都当"要改"，
       打「对」会莫名其妙重问一遍（2026-10-20 实测踩到）。确认词必须在两个入口都认。 */
    if(v.trim().startsWith("对")) return deliver();
    /* ⭐ 打字的人往往是想说"电话写错了"这类话，但**我们不知道要改哪一格** ⇒
       原样留底（进推送备注）后照样给菜单，别把他的话吞掉再让他从头猜。 */
    S.ans.note = v;
    await typing(320);
    say("收到。你点一下是哪一项要改 👌");
    setTimeout(editMenu, 300);
  });
}

/* ⭐⭐ 「哪儿不对」改单项目（2026-10-21 用户实测反馈：原来 S.i=0 全部重填，"这样有点傻"）。
   设计要点三条：
   ① **只重问被点的那一项**，其余留在原地 —— 客户改一格不该被打回原点；
   ② **菜单项带当前值**（"联系方式　13800000000"）⇒ 客户不用回忆自己填过什么，
      也避免"我明明填对了却要重填"的错觉；
   ③ **必将有一项可以给选**，极端情况（全都空）才退化为重填。
   ⛔ 别在这里做"关键词猜他想改哪项"的智能路由：猜错一次比多问一次贵得多，
      而且猜错的后果是改错了字段还浑然不觉。 */
async function editMenu(){
  S.stage = "s3";
  const items = S.queue.filter(q => S.ans[q.k] !== undefined && S.ans[q.k] !== "");
  if(!items.length){ S.i = 0; return setTimeout(nextQ, 300); }
  const clip = s => { const t = String(s); return t.length > 14 ? t.slice(0, 14) + "…" : t; };
  /* ⭐ 菜单文本里带上值是为了给人看，回调拿到的是整串 ⇒ 用下标反查 index，
     ⛔ 别拿显示串去 ans 里比对（截断过、还可能撞值，一定查错）。 */
  const labels = items.map(q => `${LABEL[q.k] || q.k}　${clip(S.ans[q.k])}`);
  const REDO = "都不对，我重新填一遍";
  options(labels.concat([REDO]), async v=>{
    clearBar();
    const idx = labels.indexOf(v);
    if(idx < 0){ S.i = 0; await typing(280); say("好，重新来一遍 👌"); return setTimeout(nextQ, 300); }
    await fixOne(items[idx].k);
  }, "点一项改一项，其余原样保留", txt => txt === REDO);
}

/* 改某一项：连带 DEP 里的依赖一起重问（目前只有 E 的 sys→scene）。
   改完不直接交付 —— 必须再过一次复述确认：客户要亲眼看到改对了才算完，
   ⛔ 改完就跳付款＝他连自己改没改成都不知道。 */
async function fixOne(k){
  const chain = [k].concat(DEP[k] || []);
  (DEP[k] || []).forEach(d => { delete S.ans[d]; });
  let i = 0;
  const step = ()=>{
    if(i >= chain.length){
      S.stage = "s3";
      return setTimeout(async ()=>{ await typing(320); say("改好了，你再看一眼 👌"); setTimeout(confirm_, 260); }, 260);
    }
    const q = S.queue.find(x => x.k === chain[i]);
    i++;
    if(!q) return step();
    askOne(q, ()=>{ setTimeout(step, 280); });
  };
  await typing(360);
  say(`改「${LABEL[k] || k}」，就这一项：`);
  step();
}

/* ⭐ S4 收尾话术按分支区分（2026-10-20 用户实测反馈后改）
   ⛔ 原来非 D 分支统一说"诊断类会先要一次后台数据口径"——两处都错：
     ① B（课程试听）/C（Agent 体验）根本不做诊断，这句纯属制造疑虑；
     ② A（链接诊断）真正要的是「款式链接」，不是"后台数据口径"。
        说成"要后台数据"会让老板以为要交账号权限，是直接的流失点。
   ⇒ 原则：每个分支只承诺它能交付的东西，别把 A 的流程说给所有人听。 */
const AFTER = {
  /* ⭐ A 分支交付物 = 两份报告（2026-10-20 定），规格见 A诊断_交付规格/ */
  A: "链接收到了，我这边给你出<b>两份报告</b>：<br>① <b>单款诊断</b>——跟 1–2 条竞品比，看这款卡在哪一环；<br>② <b>Alexa 诊断优化</b>——AI 导购来了，这款接不接得住。<br>1 个工作日内发你。<br>要是链接不好复制，把<b>款式名</b>发我也行。",
  /* ⭐ B 按所选课题报出「哪一集 + 多少分钟」（2026-10-20 定）：
     ⛔ 原来只说"试听入口在上面"等于没交付——客户不知道自己在等什么，
        也不知道这一集跟他刚选的课题是什么关系。 */
  /* ⭐ AFTER 的函数统一收 S.ans（原来 B 只收 topic）：E 要按所选系统说话，只给一个字段不够用 */
  B: function(a){
    const k = TRACK[a.topic];
    if(!k) return "试听入口在上面，选你感兴趣的课题就行。听完有具体问题可以直接问我。";
    return `试听给你 <b>${k.ep}</b>，约 ${k.min} 分钟，1 个工作日内发你（微信发你文件或链接）。`
         + `<br>先发这一集，你先看讲法对不对胃口；合适再聊后面的。`;
  },
  /* ⭐ C = 线下共创营（2026-10-20 定，原 C 是 Agent 体验，已拆到 E） */
  C: "席位我先给你留着，开营前我会把时间地点和要带的资料发你。<br>现场一次只解决一个问题，所以你先把最想解决的那一块想清楚，带着它来。",
  D: "电话之前你可以先想清楚三件事：现在的体量、最想改的<b>一个</b>指标、能投入多少时间。",
  /* ⛔ 原写「体验名额按登记顺序放」——那是免费的口气，与上面收 19.9 自相矛盾。
     ⭐ 改说「体验码」：一个码 = 一份额度，有效期和额度说到明处，用完要再加也说得通。
     ⭐ 必须点名是哪一个系统：两个 Agent 是两套东西，客户要去对的地方才用得上。 */
  E: function(a){
    /* ⭐ 点名他刚选的模块（2026-10-21）：客户点「工业CAD制版」是想干这件的，

    const m = a.scene ? `你刚选的 <b>${a.scene}</b> 可以先跑；` : "";

/* 🔴🔴 S4 走完时 `deliver()` 已经 clearBar() ⇒ **底部没有输入框了**。
   所以这句里⛔ 不能出现「直接问我」「回复『人工』」——客户手底下没有地方可输，
   写了就是一条死路（D 分支曾因同样的病让客户「回复 B」，已修过一次）。
   ⇒ 收尾只给**微信这一个真实出口**，且号不写在这里（下面 hint 里已经有了，
     同一屏两次同一个号＝像机器人复读，也会让最后那句被跳过）。 */
const AFTER_TAIL = "还有别的想问的，加微信直接问我就行 —— 我看到就回。";

/* ⭐⭐ 价格气泡（2026-10-20 定）：**⛔ 没有免费体验，只有体验价 / 诚意金**。
   🔴 只在 S4、在交付物说完之后报 —— 顺序反了（先要钱后说给什么）＝纯劝退。
   🔴 数字一律从 PRICE 取，⛔ 绝不在这里手写第二个数字。
   🔴 诚意金必须同时给出「可退」和「可抵」两个出口，⛔ 只说"诚意金"＝听着像押金。 */
function priceLine(b, a){
  const p = PRICE[b];
  if(!p) return "";
  if(b === "A")
    return `💰 这一步的费用：原价 <s>¥${p.list}</s> <b>体验价 ¥${p.trial}</b>`
         + `<br>出的是：${p.what}。付了我就按这个链接开始出。`;
  if(b === "B"){
    const k = p[a.topic];
    if(!k) return "";
    return `💰 这一步的费用：${a.topic}这门课原价 <s>¥${k.list}</s> <b>试听体验价 ¥${k.trial}</b>`
         + `<br>给的是：上面那一集完整正片。先看讲法对不对胃口，合适再聊整门课。`;
  }
  if(b === "C" || b === "D")
    return `💰 这一步的费用：${p.what}诚意金 <b>¥${p.deposit}</b>`
         + `<br>${p.back}。`;
  if(b === "E"){
    /* ⛔ E 没有原价 ⇒ 不画删除线（p.list 空就整段不出现），别为了排版好看硬造一个原价。
       ⭐ 体验码必须说清「有效期 + 额度上限」：只说 19.9，客户会当成永久不限量，用完必来吵。
       🔴 额度按所选系统取（产品设计 10,000 token / 跨境电商 10 次）：
          ⛔ 两个系统单位不同，写死一句"有限额度"＝两边都说错。 */
    const ag = AGENT[a.sys];
    if(!ag) return "";
    return `💰 这一步的费用：${p.list ? `原价 <s>¥${p.list}</s> ` : ""}<b>体验价 ¥${p.trial}</b> 一个${p.unit}`
         + `<br>${p.valid}，额度 <b>${ag.quota}</b>。`;
  }
  return "";
}
/* 应付金额（给付款按钮和推送标题用）。⛔ 与 priceLine 同源，别两处各算一遍 */
function amount(b, a){
  const p = PRICE[b]; if(!p) return "";
  if(b === "A") return p.trial;
  if(b === "B"){ const k = p[a.topic]; return k ? k.trial : ""; }
  if(b === "C" || b === "D") return p.deposit;
  if(b === "E") return p.trial;
  return "";
}

/* ⭐ 付完款会发生的那一个动作（按分支各写一句）。
   客户付完最想知道的就是「我这笔钱换来了什么动作」，⛔ 写"我们会尽快处理"＝没交付。

   ⭐ 但只做灰字小行（.rfd），⛔ 不加粗不放大 —— 这是要告知，不是要拿来劝退。
   🔴 C/D 留空：它们是诚意金，`priceLine` 里已经写了「可退可抵」，⛔ 这里再写一遍＝两条口径打架。
   ⛔ 改口径就改这里一行，⛔ 别整块删（删了结构就没了，下次还得重新加一遍）。 */
const REFUND = {

  C: "",
  D: "",

/* 收款块（2026-10-21 定：页面内给微信收款码图）
   🔴 三态：① 有金额 + 有图 ⇒ 图版；② 有金额 + 无图 ⇒ 文字版（加微信要码）；③ 无金额 ⇒ 整块不渲染。
   ⛔ 别用 if(PAY) 判空：PAY 是对象，恒为真，空配置也会渲染出一个空框。
   ⛔ 图加载失败只隐藏图，金额与做法仍在 ⇒ 永远不会出现破图（图还没上传时也不尴尬）。
   🔴 收款码不带金额，金额靠客户手输 ⇒ 数字必须和码同屏，⛔ 只在上面气泡里说一次＝必有人付错。 */
/* 文字版收款块（两处复用：① 本来就配了图 ② 图挂了要顶上去）
   ⛔ 图挂了不能只把 img 藏掉 —— 上面还写着"扫这张码付"，客户会去找一张不存在的码。
      要么整块换成文字版，要么别显示金额；选了前者（金额不能丢，客户要知道付多少）。 */
function payText(amt, fallback){
  if(!MY_WECHAT) return "";
  /* ⭐ 文字版没有码可存 ⇒ **只有转账这一条路**，⛔ 别再说"我发码给你"（他本来就领不到图）。 */
  const head = `加我微信 <b>${MY_WECHAT}</b>，转账给我就行，应付 `;
  const tail = `${PAY.howText}付款备注里写上你的名字，方便我对账。`;
  return `<div class="pay nopic">${(fallback ? "收款码没加载出来 —— " : "") + head}`
       + `<b style="color:var(--accent);font-size:17px">¥${amt}</b>`
       + `<div class="how">${tail}</div></div>`;
}
/* ⭐⭐ 复制微信号（2026-10-21 二次改判后的主路径）
   🔴 为什么必须有一键复制：微信号是 `K2XAI_123456789` 这种**字母数字混排十来位**，
      让人手抄再切到微信去搜，中间一定掉人 —— 这一步是整条付款链上最脆的地方，能省就省。
   ⛔⛔ 失败也要留出口：复制 API 在旧版 webview / 非安全上下文里会挂，
      那时把号**直接显示成按钮文字**（他至少能长按选中），⛔ 别留一个点了没反应的按钮。 */
function copyWx(btn){
  const t = MY_WECHAT;
  if(!t) return;
  saveProg();   /* ⭐ 点复制＝马上要跳出去加好友：这是跳出前最后一次落盘机会 */
  const ok = ()=>{
    btn.classList.add("done");
    btn.textContent = "✅ 已复制，去微信添加我";
    toast("微信号已复制，去微信添加我");
  };
  const showPlain = ()=>{ btn.textContent = `微信号：${t}（长按可复制）`; };
  const legacy = ()=>{
    let done = false;
    try{
      const ta = document.createElement("textarea");
      ta.value = t;
      ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
      document.body.appendChild(ta);
      ta.focus(); ta.select(); ta.setSelectionRange(0, t.length);
      done = document.execCommand("copy");
      ta.remove();
    }catch(e){ done = false; }
    done ? ok() : showPlain();
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(ok).catch(legacy);
  } else legacy();
}
function payBlock(amt){
  if(amt === "" || amt == null) return "";
  if(!PAY.img) return payText(amt, false);
  /* ⛔ 金额写「应付」而不是「扫这张码付」：图万一没出来，这句话就不通了（金额本身是中性的） */
  return `<div class="pay">`
       /* ⛔ img 外面不许包 <a>：见 .pay img 的 CSS 注释 —— 包了长按弹的是**链接**菜单，连"保存图片"都丢。 */
       + `<img src="${PAY.img}" alt="微信收款码">`
       + `<a class="zoom" href="${PAY.img}" target="_blank" rel="noopener">看不清？点这里看大图</a>`
       + `<div class="amt">应付 <b>¥${amt}</b></div>`
       /* ⭐⭐ 主路径按钮（2026-10-21 二次改判后）：**复制微信号 → 加好友 → 聊天里转账**。
          🔴 这是唯一确定能收钱的路，码和扫一扫都只是"不想加好友"时的备用。

       + (MY_WECHAT ? `<button class="btn pbtn" id="copywx" type="button">复制微信号，加我付</button>` : "")
       /* 🔴 说明**紧跟按钮**（⛔ 别放到兜底块后面）：点完复制的人下一眼要看到"加上之后怎么付"，
          放到底部会被撑开的兜底块隔开，他滑到那儿已经忘了刚才按了什么。

          紧跟着的确认卡已经说了，两处都说＝客户不知道先看哪个。 */
       + `<div class="how">${IN_WX ? PAY.howWx : PAY.howOut}`
       /* ⛔ "付不了就加我微信"这句已删：2026-10-21 二次改判后，**加微信就是主路径**，
          再说一遍＝把主路径讲成兜底，客户会以为还有更省事的路没告诉他。
          只有连微信号都没配（没有复制按钮）时才留这句，那确实是唯一的出口。 */
       + (MY_WECHAT ? "" : `付不了就加我微信，我另发收款方式。`)
       + `</div>`
       /* ⭐ 兜底默认**收起**：只有点了「不想加好友」才展开（绑定见 deliver）。
          ⛔ 一开始就铺两条路＝客户不知道先点哪个（2026-10-21 已踩：两条并列，人原地卡住）。
          ⚠️ 长按菜单到底有哪几项，各版本微信不一样（实测过的是"没有识别图中二维码"这一项）。
          ⇒ 写"保存图片"时必须**同时给一条不用长按的备选**：点上面的「看大图」，在打开的大图里长按保存。 */
       + (MY_WECHAT ? `<a class="alt" id="payfbkToggle">不想加好友？走这条路（存相册 → 扫一扫）</a>` : "")
       + `<div class="fbk" id="payfbk">不用加好友的付法：<br>`
       + `① 长按上面这张码 →「保存图片」<br>`
       + `<span class="dim">（没有「保存图片」这一项，就点上面的「看大图」，在打开的大图里长按保存）</span><br>`
       + `② 微信右上角 ⊕ →「扫一扫」<br>`
       + `③ 扫一扫里右上角 ⋯ →「相册」→ 选刚才那张<br>`
       + `付完回到这一页，点下面的「我付好了」就行 —— 刚才聊的那些我都给你存着，不用重填。</div>`
       + `</div>`;
}

/* ⭐⭐ 付完确认（2026-10-21 用户拍板：**人工核账再发码**，⛔ 不让页面自动发码）
   🔴 为什么必须有这个按钮：deliver() 一走完就 clearBar()，页面**没有输入框**了。
      客户付完想说一句"我付了"都没地方说，唯一出路只剩去加你微信 ——
      多加一道门槛就多掉一批人，而且他一退出去，这个页面的会话就找不回来了。
      ⇒ 补一个按钮，让他**留在页面里**就能告知。
        （🔴 注：付款本身如今发生在**微信聊天里**——个人收款码在 H5 上不存在付款入口，
          见 .pay img 的注释。这条链现在是：复制号 → 加好友 → 聊天里转账 → 回这页点按钮。）
   🔴🔴 为什么不能自动出码：用的是**微信个人收款码**，**没有支付回调**
      （没有商户号 ⇒ 系统收不到"钱到了"这个信号）⇒「点了就自动给码」技术上不成立。
      ⛔ 绝不让页面显示"已付款"或直接吐一个码 —— 那是假数据，客户会拿它来要交付，
         而你这头根本不知道收没收到钱 ⇒ 一定吵架。
   ⭐ 按钮只做一件事：把「这个人自称付了 + 金额 + 称呼」推给我，我去核微信支付账单。 */
function paidCard(amt){
  if(amt === "" || amt == null) return null;
  const act = PAID_ACTION[S.branch] || "开始处理";
  const c = card(`<div class="cta">`
    + `<button class="btn" id="paid">✅ 我付好了（¥${amt}）</button>`
    /* ⭐ 点之前先说清"点了会怎样"：客户最怕的是点了没反应、不知道有没有生效。
       🔴 这里⛔ 不写微信号本身：页面底部那行（#bar .hint）一直有一个号，同屏两遍＝复读。
          但也⛔ 不能一声不吭 —— 客户读完这句会问"发到哪个微信?"
          ⇒ 只**指路**、不复述号码："页面最下面那行有号"。点完之后才把号写进卡里
            （那时他确实要用到这个号去加好友）。 */
    + `<div class="tip">付完点一下（在微信里跟我说一声也一样），我这边马上能收到。核对完收款就${act}`
    + `${MY_WECHAT ? ` —— 还没加我微信的话，上面收款卡里那个「复制微信号」按一下就行` : ""}。</div>`
    + `</div>`);
  const btn = c.querySelector("#paid"), tip = c.querySelector(".tip");
  /* 🔴 恢复存档时 S.paid 可能已经是 1（他付完又跳出去过，回来重放到这一步）。
     那时按钮必须**一上来就是「已收到」态**：⛔ 显示成"我付好了"＝他以为上次没点上，
     会再按一次 —— 而 onclick 里有 S.paid 保护，点了没反应，他就卡在这儿不知道到底算不算付过。 */
  if(S.paid){
    btn.disabled = true;
    btn.classList.add("done");
    btn.textContent = "✅ 已收到，等他核对";
    tip.innerHTML = `收到了 —— 我去核一下收款，核对完就${act}。`
      + (MY_WECHAT ? `还没加我微信的话，加一下 <b>${MY_WECHAT}</b>，码直接发过去。` : "");
  }
  btn.onclick = ()=>{
    if(S.paid) return;          /* ⛔ 连点会重复推送，我这边刷屏，还会误判成两笔订单 */
    S.paid = 1;
    saveProg();                 /* ⭐ 存 p=1：他付完很可能还要切走，回来时别再让他点一次 */
    btn.disabled = true;
    btn.classList.add("done");     /* 换成"回执"外观，见 .cta .btn.done 的注释 */
    btn.textContent = "✅ 已收到，等他核对";
    /* 🔴 收尾只给微信这一个真实出口：这里没有输入框，⛔ 不许写「回复」 */
    tip.innerHTML = `收到了 —— 我去核一下收款，核对完就${act}。`
      + (MY_WECHAT ? `还没加我微信的话，加一下 <b>${MY_WECHAT}</b>，码直接发过去。` : "");
    send({pay_status:"客户称已付", pay_event:"paid_claim"});
    toast("已通知，等他核对收款");
    scroll();
  };
  return c;
}

/* S4 交付
   🔴 replay=true = 从存档**重放**（客户跳出去扫一扫又回来了）⇒ ⛔ 不能再次 send()：
      那会在你微信里再刷一条一模一样的线索，看着像来了两个客户。
      只有真正第一次走完流程才推送。 */
async function deliver(replay){
  S.stage = "s4";
  /* ⭐ 一进来就落盘（⛔ 别等函数跑完再存）：付款卡是函数中途渲染的，客户看到卡、
     点完复制就可能立刻切走 —— 存晚了就是白存（v1 的竞态洞，2026-10-21 三次反馈踩实）。 */
  saveProg();
  clearBar();
  const a = S.ans, b = S.branch;
  await typing(600);
  /* ⭐⭐ 重放先给「你的信息」回顾卡（2026-10-21 用户实测：回来只看到一张凭空冒出来的
     付款卡，观感就是"刚才聊的全丢了"）。复用复述卡的行渲染，他一眼看到答案都在。 */
  if(replay){
    say("欢迎回来 👋 你刚才答的我都记着：");
    card(recapRows(a, b));
    await typing(300);
  }

  /* ⭐ D（咨询预约）体量判定：判据是产能，不是"值不值得服务"。
     ⛔ 任何一档都不能出现"你不符合条件" —— 那等于当众否定，也掐掉一条能养的线索。 */
  /* ⭐ B 的链接按课题取（LINKS.B 是对象，不是字符串）。
     ⛔ 直接 link = LINKS[b] 会拿到一个对象，href 变成 "[object Object]" —— 死链。 */
  let link = (b === "B") ? (LINKS.B[S.ans.topic] || "")
           : (b === "E") ? (LINKS.E[S.ans.sys] || "")
           : LINKS[b], note = "", hi = "";
  if(b === "D"){
    const sc = a.scale || "";
    if(sc === "亿级以上" || sc === "千万级"){
      hi = "high"; note = "已按高意向登记，同学会优先排期。";
    }else if(sc === "百万级"){
      note = "先把你的情况过一遍，如果更适合先上课我会直说。";
    }else if(sc === "刚起步 / 说不清"){
      /* D 分支没问课题 ⇒ 取 B 里第一个配了地址的课题（没配就是空，按钮不渲染） */
      link = Object.values(LINKS.B).find(v=>v) || "";
      /* ⚠️ D 分支没问课题，⛔ 别承诺"试听入口先给你"—— B 的链接是按课题分的，此刻根本没有"那个入口"。
         ⛔ 也别让客户"回复 B"：S4 已经没有输入框了，让他回复等于把他引到死路。
         ⇒ 交给加微信/电话那一环问课题（话术见 B试听_交付规格 §4）。 */
      note = "这个阶段先把打法和口径理顺，比定制陪跑划算 —— 加你之后我按你感兴趣的课题（运营 / 经营 / 战略 / 品牌）发一集试听；咨询意向我也登记下来了。";
    }
    /* ⭐ 用户 2026-10-20 拍板：D = 留电话等回联（不做选时段，排期走人工） */
    note += "我们会在 1 个工作日内电话联系你（工作日 10:00–19:00）。";
  }

  /* ⭐ A 分支没有申请表（交付物是两份报告）：⛔ 别再说"申请入口"，会让人去找一个不存在的入口 */
  /* ⭐ B 也不用"申请"这个词：试听是登记了就发，不存在申请环节。
     ⛔ 说"申请入口"会让客户去找一个不会来的入口（A 分支已踩过同一个坑）。 */
  /* ⭐ 措辞跟着"这一步客户给的是什么"走：
     A/B/E = 付费体验（已登记）／C/D = 诚意金锁位（已锁定）。
     ⛔ 统一说"申请入口"会让 A/C/D 客户去找一个不会来的入口（同一个坑已踩两次）。
     ⛔ E 定过价后不能再落进"申请入口"那一档——客户付了钱却在等一个入口，等于没交付。 */
  say(`✅ ${(b === "C" || b === "D") ? "已锁定" : "已登记"}：<b>${BRANCH_NAME[b]}</b>`
      + (b === "B" && a.topic ? ` · ${a.topic}` : ""));
  if(note) say(note);

  const box = document.createElement("div"); box.className = "row";
  const d = document.createElement("div"); d.className = "done"; d.style.flex = "1"; d.style.maxWidth = "82%";
  /* ⛔ 没有真链接就不渲染这个按钮（LINKS 为空时 link 为 undefined）——死链比没按钮更伤信任 */
  /* ⭐ 按钮文案跟着交付物走：B=看试听 · 课题／C/D=填写申请／E=领体验码。
     ⛔ E 写"填写申请"＝客户以为还要再走一轮审批，付了钱还被卡一道。 */
  /* ⭐ E 的按钮直接指到他选的那一套系统（⛔ 不写"领体验码"：码是付完款才发的，
     点进去只是到体验站，写成"领码"＝客户点开没码，以为被骗） */
  const btnTxt = b === "B" ? "看试听 · " + (a.topic || "课程")
               : b === "E" ? "去 " + (a.sys || "Agent") + " 体验站"
               : "填写申请 · " + BRANCH_NAME[b];
  d.innerHTML = (link ? `<a class="btn" href="${link}" target="_blank" rel="noopener">${btnTxt}</a>` : "")
              + `<button class="btn ghost" id="cp">复制我的信息</button>`;
  box.appendChild(d); chat.appendChild(box); scroll();

  d.querySelector("#cp").onclick = ()=>{ copy(summary()); toast("已复制，可直接发给顾问"); };

  await typing(400);
  /* ⛔ D 分支不能再说"1–2 个工作日对接"：上面刚承诺"1 个工作日内电话联系"，
     两句并列就是自相矛盾，客户只会记住被拖的那句。 */
  /* AFTER.B 是函数（按课题报集名），其余是字符串 ⇒ 先判类型再拼，⛔ 直接 + 会把函数体拼进话术 */
  const af = AFTER[b] || AFTER.B;
  say(typeof af === "function" ? af(a) : af);

  /* ⭐ 报价紧跟在"给什么"之后，⛔ 不在开场、不在确认前报（先要钱后说给什么＝纯劝退） */
  const pl = priceLine(b, a), amt = amount(b, a);
  if(pl){
    await typing(400);
    say(pl);
    /* ⭐ 收款块 = 码 + 金额 + 怎么付 + 付完会发生什么，四样连着出。
       ⛔ 只报价不给收款路径＝客户想付都不知道付给谁，这一步的转化全漏在这里。 */
    const pb = payBlock(amt);
    if(pb){
      const pc = card(pb);
      /* 图没传 / 图挂了 ⇒ 整块换成文字版（金额保留），⛔ 别只把 img 藏掉留一句"扫这张码" */
      const im = pc.querySelector("img");
      if(im) im.onerror = ()=>{
        const w = pc.querySelector(".pay"), t = payText(amt, true);
        if(w && t) w.outerHTML = t; else if(w) w.style.display = "none";
      };
      /* ⭐ 主路径：一键复制微信号（个人收款码在 H5 里没有付款入口，能收钱的只有微信聊天里） */
      const cw = pc.querySelector("#copywx");
      if(cw) cw.onclick = ()=> copyWx(cw);
      /* ⭐ 备用路径：点了「不想加好友」才展开存相册那三步。
         ⛔ 别默认展开 —— 两条路并列＝客户不知道先点哪个（2026-10-21 已踩）。 */
      const tg = pc.querySelector("#payfbkToggle");
      if(tg) tg.onclick = (e)=>{
        e.preventDefault();
        saveProg();   /* ⭐ 展开兜底＝他要去"存相册 → 切扫一扫"，也是跳出前的一刻 */
        const f = pc.querySelector("#payfbk");
        if(!f) return;
        f.classList.toggle("on");
        tg.textContent = f.classList.contains("on")
          ? "收起 ▲"
          : "不想加好友？走这条路（存相册 → 扫一扫）";
        scroll();
      };
      await typing(400);
      /* ⭐ 退款小字紧跟收款卡、在"付完动作"之前：客户手还在码上，这一句正好拦住"我要是反悔呢"。
         ⛔ 放到最后（加微信引导附近）＝多数人根本滑不到那，等于没说。 */
      if(REFUND[b]) say(`<span class="rfd">${REFUND[b]}</span>`);
      /* ⭐ 确认按钮紧跟退款小字：客户刚看完"不退"，手就在这块屏上，顺势按下。
         ⛔ 别放到 AFTER_TAIL 后面 —— 那时候他已经滑过去了；
         ⛔ 也别再单独发一条"付完把截图发我微信 X"的气泡 —— 按钮已经承担这个动作，
            两条并列＝客户不知道该点按钮还是去加微信，且同屏再多刷一次微信号。 */
      await typing(400);
      paidCard(amt);
    }
  }
  say(AFTER_TAIL);

  const f = document.createElement("div"); f.className = "hint";
  /* ⭐ 没有企微活码时，这是唯一能沉淀好友关系的一步：聊完顺手把人加到你的微信。
     留空就不渲染（⛔ 别渲染一个空的「加我微信」） */
  /* 🔴 同理：⛔ 不写「回复『人工』」——这里没有输入框可回。
     两个出口（微信 / 电话）谁有值就渲染谁；⚠️ 都没有就**整块不挂**，别留一个空框。 */
  const parts = [];
  if(MY_WECHAT) parts.push(`想直接聊：加我微信 <b>${MY_WECHAT}</b>，备注「海报」`);
  if(MY_TEL)    parts.push(`或直接打电话 <a href="tel:${MY_TEL}">${MY_TEL}</a>`);
  if(!parts.length) f.remove();
  else { f.innerHTML = parts.join("<br>"); bar.appendChild(f); }

  /* ⛔ 重放不推送：见 deliver(replay) 的注释 —— 否则你微信里会再刷一条同样的线索 */
  if(!replay) send();
  window.__LEAD__ = payload();
  try{ localStorage.setItem(KEY, JSON.stringify(window.__LEAD__)); }catch(e){}
  /* ⭐ 走到这一步就存档：客户接下来很可能要跳去扫一扫，回来靠这个重放（见 resumeCard） */
  saveProg();
}

/* 🔴 extra = 同一条线索的**后续事件**覆盖字段（如点了「我付好了」⇒ pay_status 改成「客户称已付」）。
   单独一条推送，⛔ 不覆盖原线索（原线索还在，CRM 里是两条，能看出"登记 → 自称付款"的时间差）。 */
function payload(extra){
  const a = S.ans, t = summary();
  const hi = (S.branch === "D" && /(亿级|千万级)/.test(a.scale || ""));
  const amt = amount(S.branch, a);
  /* 结构化字段：所有 SINK 都带，给多维表 / CRM / 自建端点 */
  const base = {
    channel: CH, branch: S.branch, branch_name: BRANCH_NAME[S.branch], intent: hi ? "high" : "normal",
    name: a.name, plat: a.plat, cat: a.cat, contact: a.ct,
    scale: a.scale, stage: a.stage, block: a.block, role: a.role, want: a.want,
    topic: a.topic, trial_ep: (TRACK[a.topic] || {}).ep || "",
    seat: a.seat, scene: a.scene, now: a.now, amount: amt,
    /* ⭐ 客户在确认那一步手打的那句话（多半是"电话写错了"这类）。
       ⛔ 记了就必须发出去：吞掉一句客户主动说的话，比不问还糟（他以为你看到了。⇒ 复述卡也显示）。 */
    fix_note: a.note || "",
    /* E 选了哪一套系统 + 对应额度：发码的人照这个发，⛔ 别靠 scene 猜（两套业务的词会撞） */
    sys: a.sys, agent_quota: (AGENT[a.sys] || {}).quota || "",
    /* 收的是什么钱：trial=体验价 / deposit=诚意金 / 空=未报价。CRM 里按这个筛，⛔ 别靠分支名猜 */
    /* A/B/E = 体验价；C/D = 诚意金。⛔ E 定过价后必须显式写进 trial，
       原写法（A||B 之外全落 deposit）会把 E 记成诚意金，CRM 里按钱的类型筛就全错 */
    fee_type: (S.branch === "C" || S.branch === "D") ? "deposit" : "trial",
    /* 收款状态：目前没有支付回调，付没付只能靠人工核 ⇒ 一律先记「待收款」，
       CRM 里按这个字段跟单；⛔ 别写「已付」（页面根本收不到回调，写了就是假数据）。
       pay_way 记的是这一步给客户看的收款路径，方便复盘哪条路转化好。 */
    pay_status: (amt === "" || amt == null) ? "" : "待收款",
    pay_way: (amt === "" || amt == null) ? "" : (PAY.img ? "收款码图" : (MY_WECHAT ? "微信手动" : "")),
    ts: new Date().toISOString()
  };
  if(extra) Object.assign(base, extra);
  if(SINK === "pushplus"){
    /* ⭐ 「已付款待核销」的标题前缀必须和普通线索一眼分得开：
       微信推送列表里扫一眼就知道这笔要去核账，⛔ 别混在「新线索」里一起刷。 */
    const claim = !!(extra && extra.pay_event === "paid_claim");
    return Object.assign(base, {token: SINK_TOKEN,
      /* 课题 + 金额进标题：微信推送列表里一眼看出该发什么、收多少，不用点开正文 */
      /* ⭐ 区分字段进标题：B 带课题、E 带系统（发码的人一眼知道要发哪一种码） */
      title: (claim ? "💰 已付款待核销 · " : "新线索 · ") + BRANCH_NAME[S.branch] + (a.topic ? " · " + a.topic : "")
             + (a.sys ? " · " + a.sys : "") + (amt ? " · ¥" + amt : "") + (hi ? " · 高意向" : ""),
      /* ⛔ 正文里必须写明「这只是客户自称，不等于到账」——
        推送到了你微信，你随手一扫就当收钱了，回头对不上账是最难查的那种。 */
      content: claim ? t + "\n\n【客户点了「我付好了」】⚠️ 这是他自称的，不等于到账。"
                            + "\n待办：去微信支付账单，按 ¥" + amt + " + 备注名核一下，收到再"
                            + (PAID_ACTION[S.branch] || "处理") + "。"
                     : t,
      template: "txt"});
  }
  if(SINK === "feishu"){
    return Object.assign(base, {msg_type: "text", content: {text: t}});
  }
  if(SINK === "wecom"){
    const txt = {content: t};
    if(MENTION_HIGH && hi) txt.mentioned_list = ["@all"];
    return Object.assign(base, {msgtype: "text", text: txt});
  }
  /* raw：只发结构化字段 + 纯文本。中转（relay/lead.js）靠 text 拼推送消息，
     ⛔ 少了 text，中转只能拼出一条残缺的消息，排障时会误判成"线索丢了"。 */
  return Object.assign(base, {ua: navigator.userAgent, text: t});
}
function send(extra){
  const url = (SINK === "pushplus") ? PUSHPLUS_URL : WEBHOOK;
  if(!url || (SINK === "pushplus" && !SINK_TOKEN)) return;   /* 未配置则只出摘要 + 申请链接，不静默丢数据 */
  const body = JSON.stringify(payload(extra));
  /* 🔴 wecom 是唯一必须绕预检的：实测企微 OPTIONS 直接 403（nginx 层），
        一旦发 application/json 触发预检 → 请求根本没到业务层，线索静默丢失。
     ⇒ 走 text/plain 的 simple request（不触发预检），实测企微能正常收到并解析。
        代价：no-cors 拿不到响应，无法在前端确认成功。
     其余接收端（pushplus / feishu / raw）都有 CORS 头，正常发 JSON，还能拿到返回。 */
  if(SINK === "wecom"){
    try{
      if(navigator.sendBeacon && navigator.sendBeacon(url, new Blob([body], {type:"text/plain;charset=UTF-8"}))){
        return;   /* sendBeacon：关页面也能发，且不触发预检 */
      }
    }catch(e){}
    fetch(url, {method:"POST", mode:"no-cors", keepalive:true,
                    headers:{"Content-Type":"text/plain;charset=UTF-8"}, body}).catch(()=>{});
    return;
  }
  fetch(url, {method:"POST", keepalive:true,
                  headers:{"Content-Type":"application/json"}, body}).catch(()=>{});
}
/* 推送给微信的那一句费用（跟客户看到的价格同源，⛔ 两处各写一遍必错） */
function feeText(b, a){
  const amt = amount(b, a);
  if(amt === "") return "应付：未报价（体验价待定）";
  if(b === "A") return "应付：¥" + amt + "（体验价，原价 ¥" + PRICE.A.list + "）";
  if(b === "B"){ const k = PRICE.B[a.topic] || {}; return "应付：¥" + amt + "（试听体验价，原价 ¥" + (k.list || "-") + "）"; }
  /* ⛔ 别让 E 掉进下面那句「诚意金」——E 收的是体验价不是诚意金，推送标题写错＝你照着错的钱去收 */
  if(b === "E") return "应付：¥" + amt + "（体验码，1 个月内有效，额度 " + ((AGENT[a.sys] || {}).quota || "-") + "）";
  return "应付：¥" + amt + "（诚意金，" + PRICE[b].back + "）";
}
function summary(){
  const a = S.ans;
  return [
    "【KK 团队 · 需求登记】",
    "渠道：" + (CH || "海报扫码"),
    "需求：" + BRANCH_NAME[S.branch],
    "称呼：" + (a.name || "-"),
    "平台 / 品类：" + (a.plat || "-") + " / " + (a.cat || "-"),
    "联系方式：" + (a.ct || "-"),
    S.branch === "A" ? "链接：" + (a.url || "-") + "\n卡点：" + (a.block || "-") :
    S.branch === "B" ? "角色：" + (a.role || "-") + "\n课题：" + (a.topic || "-") + "（试听 " + ((TRACK[a.topic] || {}).ep || "待定") + "）" :
    S.branch === "C" ? "席位：" + (a.seat || "-") + "\n想解决：" + (a.want || "-") :
    S.branch === "E" ? "系统：" + (a.sys || "-") + "\n想跑：" + (a.scene || "-")
                       + "\n额度：" + ((AGENT[a.sys] || {}).quota || "-") :
                       "体量：" + (a.scale || "-") + "\n想解决：" + (a.want || "-"),
    /* 🔴 手打的那句原样带上：这是客户主动说的，比结构化字段更接近真实意图 */
    a.note ? "客户原话：" + a.note : "",
    feeText(S.branch, a)
  ].filter(Boolean).join("\n");
}
function copy(t){
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(t); return; }
  const ta = document.createElement("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
}
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

s0();
</script>
